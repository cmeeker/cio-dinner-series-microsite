name: Deploy to Cloudflare 

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Worker
    environment:
      name: cf-cio-dinner
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Fetch all commits so "last updated" timestamp on each page is accurate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare
        run: npm run cf:build
        env:
          NODE_ENV: production
    
      - name: Deploy to Cloudflare
        id: deploy-to-cf
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2e623754f3a4858cd058e5980c704374
          command: deploy

  create-tag:
    permissions:
      actions: read # is required for Trivy Report Upoad step
      id-token: write # allows the JWT to be requested from GitHub's OIDC provider
      contents: write # is required for Checkout and Bump tag steps
      security-events: write # is required for Trivy Report Upoad step
    runs-on: ubuntu-latest
    name: Create tag
    if: github.ref == 'refs/heads/main'
    needs: deploy # run only if the build job is successful
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version Helper
        # is used for automatic versioning
        # https://github.com/workato-devops/github-actions/blob/master/version-helper/README.md
        id: version-helper
        uses: workato-devops/github-actions/version-helper@v1
        with:
          branch: ${{ github.head_ref || github.ref_name }}
      - name: Bump tag
        run: |
          git tag -f ${{ steps.version-helper.outputs.next-tag }}
          git push --tags
      
