name: Deploy to Cloudflare 

on:
  push:
    branches:
      - main
      - preview
      - github-action-deploy-cf-pages
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare 
    environment:
      name: cf-cio-dinner
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all commits so "last updated" timestamp on each page is accurate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Deploy for Cloudflare
        run: npm run cf:deploy
        env:
          NODE_ENV: production

      - name: print deployment-url
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-to-cf.outputs.deployment-url }}
        run: echo $DEPLOYMENT_URL

  create-tag:
    permissions:
      actions: read # is required for Trivy Report Upoad step
      id-token: write # allows the JWT to be requested from GitHub's OIDC provider
      contents: write # is required for Checkout and Bump tag steps
      security-events: write # is required for Trivy Report Upoad step
    runs-on: ubuntu-latest
    needs: deploy # run only if the build job is successful
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version Helper
        # is used for automatic versioning
        # https://github.com/workato-devops/github-actions/blob/master/version-helper/README.md
        id: version-helper
        uses: workato-devops/github-actions/version-helper@v1
        with:
          branch: ${{ github.head_ref || github.ref_name }}
      - name: Bump tag
        run: |
          git tag -f ${{ steps.version-helper.outputs.next-tag }}
          git push --tags
      
